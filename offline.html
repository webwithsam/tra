<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — TRA Smart Revenue Hub</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4c400">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      margin: 0;
      padding: 24px;
      color: #111;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      max-width: 480px;
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      border-top: 6px solid #f4c400;
    }
    h1 { margin-top: 0; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 18px;
      background: #111;
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>No internet connection was detected. Some TRA Smart Hub pages need a live connection to process payments and load fresh receipts.</p>
    <p>You can still open previously visited pages once you're back online.</p>
    <a href="index.html">Back to Home</a>
  </div>
</body>
</html>
