# =========================================================================
# TRA Smart Revenue Hub — Nginx PWA deployment configuration
# Use this on a plain Linux/Nginx server (SSH access, no cPanel).
# Adjust server_name, root path, and PHP-FPM socket to match your server.
# =========================================================================

# ---- HTTP -> HTTPS redirect (PWA install + service workers require HTTPS) ----
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.co.tz www.yourdomain.co.tz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.co.tz www.yourdomain.co.tz;

    # ---- TLS certificates (obtain with certbot: certbot --nginx -d yourdomain.co.tz) ----
    ssl_certificate     /etc/letsencrypt/live/yourdomain.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.co.tz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/tra-revenue-hub;
    index index.html;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Service worker: must not be cached, must be allowed root scope ----
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ---- Manifest: correct MIME type, short cache ----
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, max-age=0";
        try_files $uri =404;
    }

    # ---- Static assets: long cache for performance ----
    location ~* \.(?:png|jpg|jpeg|svg|css)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- Keep receipts/ private — never served directly over HTTP ----
    location /receipts/ {
        deny all;
        return 403;
    }

    # ---- PHP handling ----
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock; # adjust PHP-FPM version/socket
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
